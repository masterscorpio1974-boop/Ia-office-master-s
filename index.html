<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OFFICE ASSISTANT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Contenedor Principal con Modo Dinámico (word o excel) -->
    <div id="app-container" data-modo="word">
        
        <!-- Encabezado de la Suite -->
        <header class="office-header">
            <div class="logo-box">
                <img src="./icon.png" onerror="this.style.display='none';this.parentElement.innerText='S'">
            </div>
            <div class="header-info">
                <h1>OFFICE ASSISTANT</h1>
                <small>By MASTER S. · SISTEMA EXCLUSIVO</small>
            </div>
            <div class="status-indicator" id="saveStatus">LISTO</div>
        </header>

        <!-- Barra de Herramientas Dinámica (Ribbon) -->
        <nav class="office-ribbon">
            <!-- Herramientas exclusivas para WORD -->
            <div class="ribbon-group" id="tools-word">
                <button onclick="formatoDoc('B')" title="Negrita"><b>B</b></button>
                <button onclick="formatoDoc('I')" title="Itálica"><i>I</i></button>
                <button onclick="formatoDoc('U')" title="Subrayado"><u>U</u></button>
                <button onclick="formatoDoc('Normal')">Normal</button>
                <button onclick="formatoDoc('G')">G</button>
                <button onclick="formatoDoc('XG')">XG</button>
                <span class="separator"></span>
                <button onclick="setColorDoc('#000000')" class="c-dot" style="background:#000000;"></button>
                <button onclick="setColorDoc('#2b579a')" class="c-dot" style="background:#2b579a;"></button>
                <button onclick="setColorDoc('#cc0000')" class="c-dot" style="background:#cc0000;"></button>
                <span class="separator"></span>
                <button onclick="formatoDoc('justifyLeft')">←</button>
                <button onclick="formatoDoc('justifyCenter')">↔</button>
                <button onclick="formatoDoc('justifyRight')">→</button>
                <button onclick="formatoDoc('insertUnorderedList')">• Lista</button>
                <span class="separator"></span>
                <button onclick="nuevoDoc()" class="btn-danger">Nuevo</button>
                <button onclick="copiarDocu()">Copiar</button>
                <button onclick="window.print()">PDF</button>
            </div>

            <!-- Herramientas exclusivas para EXCEL -->
            <div class="ribbon-group" id="tools-excel">
                <button onclick="limpiarHoja()" class="btn-danger">📄 Limpiar Hoja</button>
                <button onclick="exportarCSV()">📊 Exportar Excel</button>
                <button onclick="verMetadatosMatriz()">📝 Ver Datos Raw</button>
                <button onclick="alternarGrafica()">📈 Ver Gráfica</button>
            </div>
        </nav>

        <!-- Área de Trabajo Principal (Paneles Independientes) -->
        <main class="office-workspace">
            <!-- Editor de Word -->
            <div class="workspace-panel" id="panel-word" contenteditable="true">
                Escribe aquí tu documento...
            </div>
            
            <!-- Contenedor de Excel -->
            <div class="workspace-panel" id="panel-excel">
                <!-- La cuadrícula matemática se inyectará aquí mediante JavaScript -->
            </div>
        </main>

        <!-- Barra de Navegación por Pestañas (Fija Abajo) -->
        <footer class="office-tabs">
            <button id="tab-word" class="tab-button active" onclick="cambiarModo('word')">
                <span class="tab-icon">📝</span> Documento
            </button>
            <button id="tab-excel" class="tab-button" onclick="cambiarModo('excel')">
                <span class="tab-icon">📊</span> Hoja de Cálculo
            </button>
        </footer>

    </div>

    <!-- Carga del Cerebro de la Aplicación -->
    <script src="logic.js"></script>
</body>
</html>
