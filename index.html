<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OFFICE ASSISTANT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="h">
        <div class="logo-box"><img src="./icon.png" onerror="this.style.display='none';this.parentElement.innerText='S'"></div>
        <div><b>OFFICE ASSISTANT</b><br><small>By MASTER S. · VERSIÓN OFICIAL OFFLINE</small></div>
    </div>

    <div class="bar">
        <span id="saveStatus">LISTO - OFFLINE</span>
        <button onclick="guardarTodo()">💾 Guardar todo</button>
    </div>

    <!-- Cintas de Opciones (Ribbons) -->
    <div id="ribbonDoc" class="ribbon">
        <button onclick="formatoDoc('B')"><b>B</b></button>
        <button onclick="formatoDoc('I')"><i>I</i></button>
        <button onclick="formatoDoc('U')"><u>U</u></button>
        <button onclick="formatoDoc('Normal')">Normal</button>
        <button onclick="formatoDoc('G')">G</button>
        <button onclick="formatoDoc('XG')">XG</button>
        <button onclick="setColorDoc('#000000')" class="c-dot" style="background:#000000"></button>
        <button onclick="setColorDoc('#2b579a')" class="c-dot" style="background:#2b579a"></button>
        <button onclick="setColorDoc('#cc0000')" class="c-dot" style="background:#cc0000"></button>
        <br>
        <button onclick="nuevoDoc()">Nuevo</button>
        <button onclick="cargarDatosGuardados()" class="eye">👁️</button>
        <button onclick="copiarDocu()">Copiar</button>
        <button onclick="window.print()">PDF</button>
        <button onclick="formatoDoc('justifyLeft')">← Izq</button>
        <button onclick="formatoDoc('justifyCenter')">→ Cen ←</button>
        <button onclick="formatoDoc('justifyRight')">Der →</button>
        <button onclick="formatoDoc('insertUnorderedList')">• Lista</button>
    </div>

    <div id="ribbonSheet" class="ribbon" style="display:none;">
        <button onclick="insertarNuevaHoja()">📄 Nueva Hoja</button>
        <button onclick="cargarDatosGuardados()" class="eye">👁️</button>
        <button onclick="crearNuevoSheet()">✨ Nuevo</button>
        <button onclick="exportarExcel()">📊 Excel</button>
        <button onclick="window.print()">📄 PDF</button>
        <button onclick="generarGraficaLocal()">📈 Gráfica</button>
    </div>

    <!-- Pestañas de Navegación -->
    <div class="tabs">
        <div id="tabDoc" class="tab active" onclick="cambiarVista('doc')">Documento</div>
        <div id="tabSheet" class="tab" onclick="cambiarVista('sheet')">Hoja Cálculo</div>
    </div>

    <!-- Vistas de la Aplicación -->
    <div id="docView" class="view">
        <div id="editorDocumento" contenteditable="true">Escribe aquí tu documento...</div>
    </div>

    <div id="sheetView" class="view" style="display:none; padding:8px;">
        <div id="contenedorTabla">
            <!-- La tabla o cuadrícula de celdas se generará dinámicamente aquí -->
            <div id="graficaWrap" style="margin-top:8px;"></div>
        </div>
    </div>

    <script src="logic.js"></script>
</body>
</html>
