name: Build IA_OFFICE_ASSISTANT APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node.js versión requerida
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Java compatible
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar SDK Android
        uses: android-actions/setup-android@v3

      - name: Instalar todas las dependencias
        run: npm ci

      - name: Preparar plataforma Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sincronizar archivos al proyecto
        run: npx cap sync android

      - name: Compilar APK final
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK terminado
        uses: actions/upload-artifact@v4
        with:
          name: IA_OFFICE_ASSISTANT-MASTER_S
          path: android/app/build/outputs/apk/debug/app-debug.apk
