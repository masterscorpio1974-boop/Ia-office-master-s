name: Build IA_OFFICE_ASSISTANT APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node.js VERSIÓN EXACTA QUE PIDE CAPACITOR
        uses: actions/setup-node@v4
        with: 
          node-version: '22'

      - name: Instalar Java estable compatible
        uses: actions/setup-java@v4
        with: 
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar SDK Android
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias limpias
        run: npm ci

      - name: Sincronizar todo al proyecto Android
        run: npx cap sync android

      - name: Compilar APK final
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar APK listo
        uses: actions/upload-artifact@v4
        with:
          name: IA_OFFICE_ASSISTANT-MASTER_S
          path: android/app/build/outputs/apk/debug/app-debug.apk
