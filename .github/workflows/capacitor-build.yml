name: Build IA_OFFICE_ASSISTANT APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 📥 Obtener código
        uses: actions/checkout@v4

      - name: 🟢 Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: 🎨 Instalar ImageMagick para iconos
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: 📦 Instalar dependencias
        run: |
          npm install
          npm install @capacitor/android --save

      - name: 🔍 Verificar estructura
        run: |
          ls -la src/
          test -f src/index.html && echo "✅ index.html presente"
          test -f src/style.css && echo "✅ style.css presente"
          test -f src/logic.js && echo "✅ logic.js presente"
          test -f assets/logo.png && echo "✅ Logo presente"

      - name: 🏗️ Agregar plataforma Android (si no existe)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: 📱 Generar iconos Android desde tu logo
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          convert assets/logo.png -gravity center -extent 1:1 +repage -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert assets/logo.png -gravity center -extent 1:1 +repage -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert assets/logo.png -gravity center -extent 1:1 +repage -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert assets/logo.png -gravity center -extent 1:1 +repage -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert assets/logo.png -gravity center -extent 1:1 +repage -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
          cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
          cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          convert -size 1x1 xc:'#2b579a' -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher_background.png
          convert -size 1x1 xc:'#2b579a' -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher_background.png
          convert -size 1x1 xc:'#2b579a' -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher_background.png
          convert -size 1x1 xc:'#2b579a' -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher_background.png
          convert -size 1x1 xc:'#2b579a' -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_background.png

      - name: 🔄 Sincronizar archivos web
        run: npx cap sync android

      - name: 🛠️ Compilar APK Definitivo
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 🚀 Subir APK Terminado
        uses: actions/upload-artifact@v4
        with:
          name: IA_OFFICE_ASSISTANT-MASTER_S
          path: android/app/build/outputs/apk/debug/app-debug.apk
