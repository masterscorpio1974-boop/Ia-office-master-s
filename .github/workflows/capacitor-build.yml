name: Build IA OFFICE ASSISTANT APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 📥 Obtener código
        uses: actions/checkout@v4

      - name: 🟢 Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Instalar dependencias
        run: |
          npm install
          npm install @capacitor/android --save

      - name: 📂 Crear www y copiar archivos raiz
        run: |
          mkdir -p www
          cp index.html www/
          cp logic.js www/
          cp style.css www/
          cp icon.png www/
          ls -la www/

      - name: 🏗️ Agregar plataforma Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: 🎨 Generar Iconos Oficiales de la App
        run: |
          npm install -g @capacitor/assets
          npx capacitor-assets generate --android

      - name: 🔄 Sincronizar archivos web
        run: npx cap sync android

      - name: 🔨 Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 📤 Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: IA_OFFICE_ASSISTANT-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
