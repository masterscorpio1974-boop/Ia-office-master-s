name: Build IA OFFICE ASSISTANT APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 📥 Obtener código
        uses: actions/checkout@v4

      - name: 🟢 Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Instalar dependencias
        run: |
          npm install
          npm install @capacitor/android --save
      - name: 📂 Crear www y copiar archivos raiz
        run: |
          mkdir -p www
          cp index.html www/
          cp logic.js www/
          cp style.css www/
          cp icon.png www/
          ls -la www/
      - name: 🏗️ Construir plataforma Android Limpia
        run: |
          rm -rf android
          npx cap add android
            - name: 🏗️ Construir plataforma Android Limpia
        run: |
          rm -rf android
          npx cap add android

      - name: 🔄 Sincronizar archivos web
        run: npx cap sync android

      - name: 🎨 Inyectar Logo en Recursos de Android
        run: |
          cp icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: 🔨 Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: 📤 Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: IA_OFFICE_ASSISTANT-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
