name: Build IA_OFFICE_ASSISTANT APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 📥 Obtener código
        uses: actions/checkout@v4

      - name: 🛠️ Instalar Node.js y herramientas
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Instalar Java para Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Instalar Capacitor y dependencias
        run: |
          npm install -g @capacitor/cli @capacitor/android
          npm install

      - name: 🧪 Verificar estructura de archivos
        run: |
          ls -la src/
          test -f src/index.html && echo "✅ index.html presente"
          test -f src/style.css && echo "✅ style.css presente"
          test -f src/logic.js && echo "✅ logic.js presente"

      - name: 🤖 Agregar plataforma Android
        run: npx cap add android

      - name: 🔧 Sincronizar archivos al proyecto Android
        run: npx cap sync android

      - name: 📲 Compilar APK de depuración
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 📤 Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: IA_OFFICE_ASSISTANT-MASTER_S
          path: android/app/build/outputs/apk/debug/app-debug.apk
