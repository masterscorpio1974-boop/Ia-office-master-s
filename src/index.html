<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OFFICE_ASSISTANT By MASTER S.</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="head">
    <div class="logo-img"><img src="assets/logo.png" alt="S"></div>
    <div class="title">
        <h1>OFFICE_ASSISTANT</h1>
        <p><small>By MASTER S. · VERSIÓN OFICIAL</small></p>
    </div>
</div>

<div class="status-bar">
    <span id="saveStatus" class="status-text">LISTO - OFFLINE SIN CONEXIONES EXTERNAS</span>
    <button onclick="saveAll()" class="btn-save">🔒 Guardar todo</button>
</div>

<div class="ribbon" id="ribbonDoc">
    <div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px;">
        <button onclick="aplicarEstilo('bold')"><b>B</b></button>
        <button onclick="aplicarEstilo('italic')"><i>I</i></button>
        <button onclick="aplicarEstilo('underline')"><u>U</u></button>
        <div style="width: 1px; height: 18px; background: #ccc;"></div>
        <button onclick="aplicarTamano('3')">Normal</button>
        <button onclick="aplicarTamano('5')"><b>G</b></button>
        <button onclick="aplicarTamano('7')"><b>XG</b></button>
    </div>
    
    <div style="display: flex; gap: 12px; align-items: center; margin-bottom: 10px; background: #f5f5f5; padding: 6px; border-radius: 4px; border: 1px solid #ddd;">
        <span style="font-size: 11px; font-weight: bold; color: #555;">Color:</span>
        <button onclick="aplicarColor('#000000')" style="width: 26px; height: 26px; background: #000; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 2px #000; padding:0; cursor:pointer;"></button>
        <button onclick="aplicarColor('#2b579a')" style="width: 26px; height: 26px; background: #2b579a; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 2px #000; padding:0; cursor:pointer;"></button>
        <button onclick="aplicarColor('#cc0000')" style="width: 26px; height: 26px; background: #cc0000; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 2px #000; padding:0; cursor:pointer;"></button>
    </div>
    
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px;">
        <button onclick="cargarDatosGuardados()" style="background: #2b579a; color: white; font-size: 11px; padding: 8px 2px; font-weight: bold; border: none; border-radius: 4px;">Ver Datos</button>
        <button onclick="crearNuevo()" style="background: #e0e0e0; font-size: 11px; padding: 8px 2px; font-weight: bold; border: 1px solid #ccc; border-radius: 4px;">Nuevo</button>
        <button onclick="copiarDocumento()" style="background: #e0e0e0; font-size: 11px; padding: 8px 2px; font-weight: bold; border: 1px solid #ccc; border-radius: 4px;">Copiar</button>
    </div>

    <div class="format-grid">
        <button onclick="aplicarEstilo('justifyLeft')"><span>←</span>Alinear Izq</button>
        <button onclick="aplicarEstilo('justifyCenter')"><span>↔</span>Centrar</button>
        <button onclick="aplicarEstilo('justifyRight')"><span>→</span>Alinear Der</button>
        <button onclick="aplicarEstilo('insertUnorderedList')"><span>•</span>Lista</button>
    </div>
</div>

<div class="ribbon" id="ribbonSheet" style="display:none;">
    <div class="format-grid" style="grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));">
        <button onclick="insertarNuevaHoja()"><span>➕</span>+ Hoja</button>
        <button onclick="crearNuevoSheet()" style="background:#e0e0e0; border:1px solid #ccc;"><span>🗑️</span>Nuevo</button>
        <button onclick="exportarExcel()"><span>📊</span>Excel</button>
        <button onclick="exportarPDF()"><span>📄</span>PDF</button>
        <button onclick="generarGraficaLocal()"><span>📈</span>Grafica</button>
    </div>
</div>

<div class="tabs">
    <div class="tab active" id="tabDoc" onclick="cambiarVista('doc')">Documento</div>
    <div class="tab" id="tabSheet" onclick="cambiarVista('sheet')">Hoja Cálculo</div>
</div>

<div class="content">
    <div id="docView" class="editor-container" contenteditable="true" onmouseup="guardarSeleccion()" onkeyup="guardarSeleccion()" ontouchend="guardarSeleccion()">
        <p>Escribe aquí tu documento...</p>
    </div>

    <div id="sheetView" style="display:none;">
        <div class="sheet-container" id="contenedorTabla">
            <p style="color:#666; font-size:13px; margin:0;">Presiona el botón <b>"+ Hoja"</b> arriba para desplegar un registro de datos interactivo.</p>
        </div>
        <div id="graficaWrap" class="chart-container" style="display:none;">
            <div style="font-weight:bold; font-size:12px; margin-bottom:8px; color:#333;">Visualización Estadística de Datos Local</div>
            <canvas id="miGrafica" width="300" height="150"></canvas>
        </div>
    </div>
</div>

<script src="logic.js"></script>
</body>
</html>
