<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>OFFICE_ASSISTANT By MASTER S.</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="header">
  <img src="../assets/logo.png" onerror="this.style.display='none'">
  <div class="header-text"><b>OFFICE_ASSISTANT</b><br><small>By MASTER S. · VERSIÓN OFICIAL OFFLINE</small></div>
</div>
<div class="bar"><span id="saveStatus">LISTO - OFFLINE</span><button onclick="saveAll()">🔒 Guardar todo</button></div>

<div id="ribbonDoc" class="ribbon">
  <div class="row">
    <button onclick="aplicarEstilo('bold')"><b>B</b></button>
    <button onclick="aplicarEstilo('italic')"><i>I</i></button>
    <button onclick="aplicarEstilo('underline')"><u>U</u></button>
    <button onclick="aplicarTamano('3')">Normal</button>
    <button onclick="aplicarTamano('5')">G</button>
    <button onclick="aplicarTamano('7')">XG</button>
    <button onclick="aplicarColor('#000')" style="background:#000;width:16px;height:16px;border-radius:50%"></button>
    <button onclick="aplicarColor('#2b579a')" style="background:#2b579a;width:16px;height:16px;border-radius:50%"></button>
    <button onclick="aplicarColor('#cc0000')" style="background:#c00;width:16px;height:16px;border-radius:50%"></button>
  </div>
  <div class="row">
    <button onclick="crearNuevo()">Nuevo</button>
    <button onclick="cargarDatosGuardados()" class="btn-eye">👁️</button>
    <button onclick="copiarDocumento()">Copiar</button>
    <button onclick="exportarPDF()">PDF</button>
    <button onclick="aplicarEstilo('justifyLeft')">←Izq</button>
    <button onclick="aplicarEstilo('justifyCenter')">↔Cen</button>
    <button onclick="aplicarEstilo('justifyRight')">Der→</button>
    <button onclick="aplicarEstilo('insertUnorderedList')">•Lista</button>
  </div>
</div>

<div id="ribbonSheet" class="ribbon" style="display:none">
  <div class="row">
    <button onclick="insertarNuevaHoja()">+Hoja</button>
    <button onclick="cargarDatosGuardados()" class="btn-eye">👁️</button>
    <button onclick="crearNuevoSheet()">Nuevo</button>
    <button onclick="exportarExcel()">Excel</button>
    <button onclick="exportarPDF()">PDF</button>
    <button onclick="generarGraficaLocal()">Gráfica</button>
  </div>
</div>

<div class="tabs">
  <div id="tabDoc" class="tab active" onclick="cambiarVista('doc')">Documento</div>
  <div id="tabSheet" class="tab" onclick="cambiarVista('sheet')">Hoja Cálculo</div>
</div>

<div id="docView" contenteditable="true">Escribe aquí tu documento...</div>
<div id="sheetView" style="display:none"><div id="contenedorTabla"></div><div id="graficaWrap" style="display:none"><canvas id="miGrafica" width="400" height="200"></canvas></div></div>
<script src="logic.js"></script>
</body>
</html>
