<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OFFICE_ASSISTANT By MASTER S.</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="head"> ...logo... </div>

<div class="status-bar">
    <span id="saveStatus">LISTO - OFFLINE SIN CONEXIONES EXTERNAS</span>
    <button onclick="saveAll()" class="btn-save">🔒 Guardar todo</button>
</div>

<!-- RIBBON DOCUMENTO - UNICO -->
<div id="ribbonDoc" class="ribbon">
    <div class="group">
        <button onclick="crearNuevo()">🗑️ Nuevo</button>
        <button onclick="cargarDatosGuardados()" style="background:#2b579a;color:white;font-weight:bold;">👁️ Ver Datos</button>
        <button onclick="copiarDocumento()">📋 Copiar</button>
        <button onclick="exportarPDF()">📄 PDF</button>
    </div>
    <div class="group">
        <button onclick="aplicarEstilo('bold')"><b>B</b></button>
        <button onclick="aplicarEstilo('italic')"><i>I</i></button>
        <button onclick="aplicarEstilo('underline')"><u>U</u></button>
        <input type="color" onchange="aplicarColor(this.value)" title="Color">
        <select onchange="aplicarTamano(this.value)">
            <option value="3">Normal</option>
            <option value="5">Grande</option>
            <option value="7">Muy Grande</option>
        </select>
    </div>
</div>

<!-- RIBBON HOJA - UNICO -->
<div id="ribbonSheet" class="ribbon" style="display:none;">
    <div class="group">
        <button onclick="insertarNuevaHoja()" style="background:#217346;color:white;">➕ + Hoja</button>
        <button onclick="cargarDatosGuardados()" style="background:#2b579a;color:white;font-weight:bold;">👁️ Ver Datos</button>
        <button onclick="crearNuevoSheet()">🗑️ Nuevo</button>
        <button onclick="exportarExcel()">📊 Excel</button>
        <button onclick="exportarPDF()">📄 PDF</button>
        <button onclick="generarGraficaLocal()">📈 Gráfica</button>
    </div>
</div>

<div class="tabs">
    <div class="tab active" id="tabDoc" onclick="cambiarVista('doc')">Documento</div>
    <div class="tab" id="tabSheet" onclick="cambiarVista('sheet')">Hoja Cálculo</div>
</div>
<div class="content">
    <div id="docView" class="editor-container" contenteditable="true" onmouseup="guardarSeleccion()" onkeyup="guardarSeleccion()" ontouchend="guardarSeleccion()">
        <p>Escribe aquí tu documento...</p>
    </div>
    <div id="sheetView" style="display:none;">
        <div class="sheet-container" id="contenedorTabla">
            <p style="color:#666; font-size:13px; margin:0;">Presiona el botón <b>"+ Hoja"</b> arriba para desplegar un registro de datos interactivo.</p>
        </div>
        <div id="graficaWrap" class="chart-container" style="display:none;">
            <div style="font-weight:bold; font-size:12px; margin-bottom:8px; color:#333;">Visualización Estadística de Datos Local</div>
            <canvas id="miGrafica" width="300" height="150"></canvas>
        </div>
    </div>
</div>

<script src="logic.js"></script>
</body>
</html>
